# Manual only. A push does not deploy. GitHub can require a reviewer on the
# production environment before this job starts.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaca-public-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VACA_API_ORIGIN: ${{ vars.VACA_API_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      - name: Deploy the API
        run: bash scripts/deploy/deploy-api.sh
      - name: Deploy the page
        run: bash scripts/deploy/deploy-web.sh
