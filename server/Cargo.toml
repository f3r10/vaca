[package]
name = "vaca-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "HTTP API for Vaca pots. Counts a checked proof. Does not sign, melt, or refund."

[dependencies]
axum = "0.8"
# crates.io release that matches CDK 24360fe5. Not a path dependency.
cashu = { version = "=0.18.0", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
